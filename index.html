<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>NHL Morning Briefing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: dark;
  --gold: #B4975A;
  --gold-light: #D4B97A;
  --gold-dim: rgba(180,151,90,0.12);
  --gold-dim2: rgba(180,151,90,0.07);
  --purple: #7C6AE8;
  --purple-light: #A89DF0;
  --purple-dim: rgba(124,106,232,0.12);
  --ink: #0D1117;
  --muted: #6B7A99;
  --muted2: #8895B0;
  --border: rgba(255,255,255,0.08);
  --border2: rgba(255,255,255,0.05);
  --green: #3DC97B;
  --surface: rgba(255,255,255,0.04);
  --surface2: rgba(255,255,255,0.02);
  --display: 'Bebas Neue', 'Oswald', 'Arial Narrow', sans-serif;
  --sans: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --mono: 'DM Mono', 'SF Mono', Menlo, Consolas, monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  background: var(--ink);
  color: #D0D8EC;
  font-family: var(--sans);
  font-weight: 300;
  min-height: 100vh;
  background-image:
    radial-gradient(ellipse 80% 40% at 50% -10%, rgba(180,151,90,0.08) 0%, transparent 60%),
    radial-gradient(ellipse 60% 30% at 80% 100%, rgba(124,106,232,0.06) 0%, transparent 50%);
}
body::before {
  content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background-image: repeating-linear-gradient(0deg, transparent, transparent 40px,
    rgba(255,255,255,0.012) 40px, rgba(255,255,255,0.012) 41px);
}
.container { max-width: 1100px; margin: 0 auto; padding: 0 24px 60px; position: relative; z-index: 1; }

/* HEADER */
header {
  padding: 32px 0 18px; display: flex; align-items: flex-end; justify-content: space-between;
  gap: 18px; margin-bottom: 0; flex-wrap: wrap;
}
.header-left h1 {
  font-family: var(--display); font-size: 52px; letter-spacing: 0.04em;
  line-height: 1; color: #fff; margin-bottom: 8px; font-weight: 400;
}
.header-left h1 span { color: var(--gold); }
.header-meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.header-date {
  font-family: var(--mono); font-size: 12px; color: var(--muted);
  letter-spacing: 0.06em; text-transform: uppercase;
}
.badge {
  display: inline-flex; align-items: center; font-size: 10.5px; font-weight: 500;
  padding: 3px 10px; border-radius: 20px; letter-spacing: 0.05em; text-transform: uppercase;
}
.badge-vgk { background: var(--gold-dim); color: var(--gold-light); border: 0.5px solid rgba(180,151,90,0.3); }
.badge-pod { background: linear-gradient(90deg, rgba(30,80,200,0.18) 0%, rgba(200,30,40,0.18) 100%); color: #fff; border: 0.5px solid rgba(200,30,40,0.4); }
.edition-pick { display: flex; flex-direction: column; gap: 5px; align-items: flex-end; }
.edition-label {
  font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--muted);
}
#editionSelect {
  font-family: var(--sans); font-size: 13px; color: #D0D8EC; background: var(--surface);
  border: 0.5px solid var(--border); border-radius: 8px; padding: 8px 12px; cursor: pointer;
}

/* LEDE */
.lede { margin-bottom: 26px; }
.lede-tag {
  font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--gold); margin-bottom: 10px;
}
.lede h2 { font-size: 27px; line-height: 1.25; color: #fff; font-weight: 500; margin-bottom: 10px; }
.lede p { font-size: 15px; line-height: 1.7; color: #b8c3d8; max-width: 820px; }

/* METRICS */
.metrics-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; margin-bottom: 22px; }
.metric { background: var(--surface); border: 0.5px solid var(--border); border-radius: 10px; padding: 11px 14px; }
.metric.gold-accent { border-left: 2px solid var(--gold); }
.metric-label {
  font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--muted); margin-bottom: 6px;
}
.metric-value {
  font-family: var(--display); font-size: 26px; letter-spacing: 0.04em;
  color: #fff; line-height: 1; margin-bottom: 4px; font-weight: 400;
}
.metric-value.sm { font-size: 17px; padding-top: 2px; line-height: 1.1; }
.metric-sub { font-size: 11px; color: var(--muted2); }

/* TABS */
.tab-row {
  display: flex; gap: 0; border-bottom: 0.5px solid var(--border);
  margin-bottom: 24px; overflow-x: auto;
}
.tab-row::-webkit-scrollbar { display: none; }
.tab {
  font-family: var(--sans); font-size: 14px; font-weight: 400; color: var(--muted);
  background: none; border: none; border-bottom: 2px solid transparent;
  padding: 10px 11px; cursor: pointer; white-space: nowrap; margin-bottom: -1px;
  transition: color 0.15s;
}
.tab:hover { color: #c0c8dc; }
.tab.active { color: #fff; font-weight: 500; border-bottom-color: var(--gold); }
.tab-panel { display: none; }
.tab-panel.active { display: block; }

/* CARDS */
.card {
  background: var(--surface); border: 0.5px solid var(--border);
  border-radius: 14px; padding: 18px 20px; margin-bottom: 14px;
}
.card-gold { border-left: 2px solid var(--gold); border-radius: 0 14px 14px 0; }
.card-purple { border-left: 2px solid var(--purple); border-radius: 0 14px 14px 0; }
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.two-col .card { margin-bottom: 0; }

.sec-title {
  font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--muted); margin-bottom: 12px;
}

/* SCOREBOARD */
.scoreboard { display: flex; align-items: center; margin-bottom: 10px; }
.sb-side { display: flex; flex-direction: column; align-items: center; flex: 1; }
.sb-abbr {
  font-family: var(--display); font-size: 36px; letter-spacing: 0.08em;
  line-height: 1; font-weight: 400;
}
.sb-abbr.winner-team { color: #fff; }
.sb-abbr.loser-team  { color: var(--muted); }
.sb-venue-tag {
  font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--muted); margin-top: 5px;
}
.sb-center { display: flex; align-items: center; gap: 10px; padding: 0 18px; }
.sb-score {
  font-family: var(--display); font-size: 54px; letter-spacing: 0.02em;
  line-height: 1; color: #fff; font-weight: 400;
}
.sb-score.dim { color: var(--muted2); }
.sb-sep { color: var(--muted); font-size: 22px; padding-bottom: 4px; }

/* SCORES PANEL — compact cards + responsive grid */
.scores-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; }
.score-card {
  background: var(--surface); border: 0.5px solid var(--border);
  border-radius: 12px; padding: 11px 14px;
}
.score-card.card-gold { border-left: 2px solid var(--gold); border-radius: 0 12px 12px 0; }
.score-card .sec-title { font-size: 9px; margin-bottom: 7px; }
.score-card .scoreboard { margin-bottom: 7px; }
.score-card .sb-abbr { font-size: 22px; }
.score-card .sb-score { font-size: 36px; }
.score-card .sb-sep { font-size: 14px; padding-bottom: 2px; }
.score-card .sb-center { padding: 0 10px; gap: 7px; }
.score-card .sb-venue-tag { font-size: 8.5px; margin-top: 3px; }
.score-card .snote { font-size: 10px; padding: 2px 8px; margin-bottom: 8px; }
.score-card .goal-log { margin: 6px 0 9px; }
.score-card .goal-period-header { font-size: 8px; padding: 6px 0 3px; }
.score-card .goal-row { font-size: 11.5px; padding: 4px 0; gap: 6px; }
.score-card .goal-time { font-size: 9.5px; min-width: 30px; }
.score-card .goal-team-badge { font-size: 8px; padding: 1px 5px; }
.score-card .goal-assists { font-size: 11px; }
.score-card .goal-strength { font-size: 8px; padding: 1px 4px; }
.score-card .ai-block { font-size: 12px; line-height: 1.55; }

/* GAME / SERIES */
.game-score {
  font-family: var(--display); font-size: 25px; letter-spacing: 0.03em;
  color: #fff; line-height: 1.15; margin-bottom: 8px; font-weight: 400;
}
.series-teams {
  font-family: var(--display); font-size: 23px; letter-spacing: 0.03em;
  color: #fff; line-height: 1.15; margin-bottom: 9px; font-weight: 400;
}
.snote, .badge-status {
  display: inline-block; font-size: 11px; font-weight: 500; padding: 3px 11px;
  border-radius: 20px; margin-bottom: 11px; letter-spacing: 0.02em;
}
.snote, .badge-status.lead { background: rgba(61,201,123,0.13); color: var(--green);
  border: 0.5px solid rgba(61,201,123,0.3); }
.badge-status.tied { background: var(--surface); color: var(--muted2); border: 0.5px solid var(--border); }
.next-line { font-size: 12.5px; color: var(--muted2); margin-top: 4px; }
.next-line strong { color: #fff; font-weight: 500; }

/* GOAL LOG */
.goal-log { margin: 10px 0 14px; border-top: 0.5px solid var(--border2); }
.goal-period-header {
  font-family: var(--mono); font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--muted); padding: 8px 0 4px; margin-top: 2px;
}
.goal-row {
  display: flex; align-items: baseline; gap: 8px;
  padding: 5px 0; border-top: 0.5px solid var(--border2); font-size: 12.5px;
}
.goal-time { font-family: var(--mono); font-size: 10.5px; color: var(--muted2); min-width: 36px; flex-shrink: 0; }
.goal-team-badge {
  font-family: var(--mono); font-size: 9px; font-weight: 600; letter-spacing: 0.06em;
  padding: 2px 6px; border-radius: 4px; flex-shrink: 0;
  background: var(--surface); border: 0.5px solid var(--border); color: var(--muted2);
}
.goal-team-badge.vgk { background: rgba(180,151,90,0.15); border-color: rgba(180,151,90,0.35); color: var(--gold); }
.goal-scorer { color: #fff; font-weight: 500; flex-shrink: 0; }
.goal-assists { color: var(--muted2); font-size: 12px; }
.goal-strength {
  margin-left: auto; font-family: var(--mono); font-size: 9px; letter-spacing: 0.06em;
  padding: 1px 5px; border-radius: 3px; flex-shrink: 0;
}
.goal-strength.pp { background: rgba(180,151,90,0.15); color: var(--gold); border: 0.5px solid rgba(180,151,90,0.3); }
.goal-strength.en { background: rgba(100,100,120,0.2); color: var(--muted2); border: 0.5px solid var(--border); }
.goal-strength.sh { background: rgba(61,201,123,0.1); color: var(--green); border: 0.5px solid rgba(61,201,123,0.25); }

/* RECAP TOGGLE (inside score cards) */
.recap-toggle-btn {
  display: flex; align-items: center; justify-content: space-between;
  width: 100%; background: none; border: none;
  border-top: 0.5px solid var(--border2);
  padding: 7px 0 0; margin-top: 6px; cursor: pointer;
  font-family: var(--mono); font-size: 9px; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--muted);
  transition: color 0.15s;
}
.recap-toggle-btn:hover, .recap-toggle-btn.open { color: var(--gold-light); }
.recap-toggle-btn .rtb-chevron { font-size: 10px; transition: transform 0.2s; display: inline-block; line-height: 1; }
.recap-toggle-btn.open .rtb-chevron { transform: rotate(180deg); }
.recap-body { display: none; padding-top: 9px; }
.recap-body.open { display: block; }

/* AI / PROSE BLOCKS */
.ai-block { font-size: 14px; line-height: 1.75; color: #b8c3d8; font-weight: 300; }
.ai-block p { margin-bottom: 12px; }
.ai-block p:last-child { margin-bottom: 0; }

/* FACT LIST */
.fact-list { list-style: none; margin: 14px 0 4px; }
.fact-list li {
  font-size: 13px; line-height: 1.55; color: #c0c8dc; padding: 9px 0 9px 18px;
  position: relative; border-top: 0.5px solid var(--border2);
}
.fact-list li::before {
  content: ''; position: absolute; left: 0; top: 15px; width: 6px; height: 6px;
  background: var(--gold); border-radius: 50%;
}

/* SCORING LEADERS */
.scoring-row {
  display: flex; align-items: center; padding: 9px 0; gap: 11px; font-size: 13px;
  border-bottom: 0.5px solid var(--border2);
}
.scoring-row:last-child { border-bottom: none; padding-bottom: 0; }
.scoring-row:first-of-type { padding-top: 2px; }
.scoring-rank {
  color: var(--muted); width: 16px; font-size: 11px; font-family: var(--mono); flex-shrink: 0;
}
.scoring-name { flex: 1; color: #c0c8dc; }
.scoring-name strong { color: #fff; font-weight: 500; display: block; }
.scoring-team-label { color: var(--muted2); font-size: 11px; font-family: var(--mono); }
.scoring-note { color: var(--muted2); font-size: 11.5px; flex: 1.6; line-height: 1.4; }
.scoring-pts {
  font-family: var(--display); font-size: 22px; color: #fff; min-width: 56px;
  text-align: right; letter-spacing: 0.03em;
}

/* ANGLES */
.angle-list { list-style: none; counter-reset: a; margin-top: 4px; }
.angle-list li {
  counter-increment: a; position: relative; padding: 13px 0 13px 38px;
  font-size: 14px; line-height: 1.65; color: #c0c8dc; border-top: 0.5px solid var(--border2);
}
.angle-list li:first-child { border-top: none; }
.angle-list li::before {
  content: counter(a,decimal-leading-zero); position: absolute; left: 0; top: 13px;
  font-family: var(--mono); font-size: 12px; color: var(--purple-light);
  border: 0.5px solid rgba(124,106,232,0.35); border-radius: 6px; padding: 2px 6px;
}

/* NEWS */
.news-item { padding: 14px 0; border-top: 0.5px solid var(--border2); }
.news-item:first-child { border-top: none; padding-top: 2px; }
.news-item h4 { font-size: 15px; line-height: 1.35; color: #fff; font-weight: 500; }
.news-item h4 a { color: inherit; text-decoration: none; }
.news-item h4 a:hover { color: var(--gold-light); }
.news-item p { font-size: 13px; line-height: 1.6; color: var(--muted2); margin-top: 5px; }
.news-item .news-src {
  font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--gold); margin-top: 6px;
}
.empty { font-size: 13px; color: var(--muted); line-height: 1.6; }

/* INJURIES */
.injury-row {
  display: flex; align-items: flex-start; gap: 14px; padding: 13px 0;
  border-top: 0.5px solid var(--border2);
}
.injury-row:first-child { border-top: none; padding-top: 2px; }
.injury-status {
  font-family: var(--mono); font-size: 10px; font-weight: 500; letter-spacing: 0.06em;
  padding: 3px 10px; border-radius: 20px; white-space: nowrap; flex-shrink: 0; margin-top: 2px;
}
.injury-status.out    { background: rgba(220,60,60,0.14); color: #E87070; border: 0.5px solid rgba(220,60,60,0.3); }
.injury-status.dtd    { background: rgba(230,160,30,0.14); color: #E8C060; border: 0.5px solid rgba(230,160,30,0.3); }
.injury-status.ir     { background: rgba(220,60,60,0.10); color: #C06060; border: 0.5px solid rgba(220,60,60,0.2); }
.injury-status.active { background: rgba(61,201,123,0.13); color: var(--green); border: 0.5px solid rgba(61,201,123,0.3); }
.injury-name { flex: 1; }
.injury-name strong { font-size: 14px; color: #fff; font-weight: 500; display: block; margin-bottom: 2px; }
.injury-meta { font-family: var(--mono); font-size: 10.5px; color: var(--muted2); margin-bottom: 4px; letter-spacing: 0.03em; }
.injury-detail { font-size: 12.5px; color: var(--muted2); line-height: 1.55; }

/* TRANSACTIONS */
.txn-item { padding: 13px 0; border-top: 0.5px solid var(--border2); }
.txn-item:first-child { border-top: none; padding-top: 2px; }
.txn-header { display: flex; align-items: center; gap: 10px; margin-bottom: 5px; flex-wrap: wrap; }
.txn-type {
  font-family: var(--mono); font-size: 10px; font-weight: 500; letter-spacing: 0.06em;
  text-transform: uppercase; padding: 2px 9px; border-radius: 20px;
  background: var(--surface); color: var(--muted2); border: 0.5px solid var(--border);
}
.txn-date { font-family: var(--mono); font-size: 10px; color: var(--muted); letter-spacing: 0.04em; }
.txn-headline { font-size: 14px; color: #fff; font-weight: 500; line-height: 1.35; }
.txn-headline a { color: inherit; text-decoration: none; }
.txn-headline a:hover { color: var(--gold-light); }
.txn-detail { font-size: 12.5px; color: var(--muted2); line-height: 1.55; margin-top: 4px; }
.txn-src { font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--gold); margin-top: 5px; }

/* AM REWIND */
.amr-channel { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; padding-bottom: 14px; border-bottom: 0.5px solid var(--border2); }
.amr-channel-icon {
  width: 42px; height: 42px; border-radius: 50%; background: var(--gold-dim);
  border: 1px solid rgba(180,151,90,0.35); display: flex; align-items: center; justify-content: center;
  font-family: var(--display); font-size: 18px; color: var(--gold-light); flex-shrink: 0; letter-spacing: 0.05em;
}
.amr-channel-info { flex: 1; }
.amr-channel-info strong { font-size: 14px; color: #fff; font-weight: 500; display: block; }
.amr-channel-info span { font-size: 12px; color: var(--muted2); }
.amr-channel-link { font-family: var(--mono); font-size: 11px; color: var(--gold); text-decoration: none; letter-spacing: 0.04em; }
.amr-channel-link:hover { color: var(--gold-light); }
.amr-video { padding: 12px 0; border-top: 0.5px solid var(--border2); }
.amr-video:first-child { border-top: none; }
.amr-video-header { display: flex; align-items: center; gap: 10px; margin-bottom: 5px; flex-wrap: wrap; }
.amr-video-type {
  font-family: var(--mono); font-size: 10px; font-weight: 500; letter-spacing: 0.06em;
  text-transform: uppercase; padding: 2px 9px; border-radius: 20px;
  background: var(--purple-dim); color: var(--purple-light); border: 0.5px solid rgba(124,106,232,0.3);
}
.amr-video-date { font-family: var(--mono); font-size: 10px; color: var(--muted); letter-spacing: 0.04em; }
.amr-video-title { font-size: 14px; color: #fff; font-weight: 500; line-height: 1.35; }
.amr-video-title a { color: inherit; text-decoration: none; }
.amr-video-title a:hover { color: var(--gold-light); }
.amr-video-desc { font-size: 12.5px; color: var(--muted2); line-height: 1.55; margin-top: 4px; }
.amr-comment { padding: 10px 0; border-top: 0.5px solid var(--border2); font-size: 12.5px; }
.amr-comment-author { color: var(--gold-light); font-weight: 500; margin-bottom: 3px; }
.amr-comment-text { color: var(--muted2); line-height: 1.5; }

/* PODCAST HUB */
.pod-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 700px) { .pod-grid { grid-template-columns: 1fr; } }
.pod-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; }
.pod-card.gold { border-left: 2px solid var(--gold); border-radius: 0 14px 14px 0; }
.pod-card.purple { border-left: 2px solid var(--purple); border-radius: 0 14px 14px 0; }
.pod-card.green { border-left: 2px solid var(--green); border-radius: 0 14px 14px 0; }
.pod-show-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; padding-bottom: 10px; border-bottom: 0.5px solid var(--border2); }
.pod-show-icon {
  width: 34px; height: 34px; border-radius: 8px; background: var(--surface);
  border: 0.5px solid var(--border); display: flex; align-items: center; justify-content: center;
  font-family: var(--mono); font-size: 9px; font-weight: 500; color: var(--muted2); flex-shrink: 0; letter-spacing: 0.03em;
}
.pod-show-icon.gold { background: var(--gold-dim); border-color: rgba(180,151,90,0.3); color: var(--gold-light); }
.pod-show-icon.purple { background: var(--purple-dim); border-color: rgba(124,106,232,0.3); color: var(--purple-light); }
.pod-show-icon.green { background: rgba(61,201,123,0.1); border-color: rgba(61,201,123,0.3); color: var(--green); }
.pod-show-info { flex: 1; min-width: 0; }
.pod-show-info strong { font-size: 12px; color: #fff; font-weight: 500; display: block; margin-bottom: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pod-show-info span { font-size: 10.5px; color: var(--muted2); }
.pod-show-link { font-family: var(--mono); font-size: 10px; color: var(--gold); text-decoration: none; letter-spacing: 0.04em; flex-shrink: 0; }
.pod-show-link:hover { color: var(--gold-light); }
.pod-ep { padding: 8px 0; border-top: 0.5px solid var(--border2); }
.pod-ep:first-of-type { border-top: none; padding-top: 0; }

arlier reports, there is no expectation that Jay Woodcroft will interview with the Maple Leafs, nor is there any expectation Toronto will ask permission to speak with the Anaheim Ducks assistant. Kings did interview Woodcroft for their vacancy.", "url": "https://x.com/FriedgeHNIC"}]}, {"insider": "Pierre LeBrun", "handle": "@PierreVLeBrun", "outlet": "The Athletic", "tweets": [{"date": "2026-05-30", "text": "Also watching Mason McTavish closely. No evidence Anaheim is actively shopping him, but several teams have inquired. He's coming off a disappointing first season of his six-year contract.", "url": "https://x.com/PierreVLeBrun"}, {"date": "2026-05-29", "text": "A Morgan Rielly trade this offseason has become rather inevitable. It's now more about where the longest-tenured Maple Leaf ends up. His agent and the team have had preliminary conversations.", "url": "https://x.com/PierreVLeBrun"}]}, {"insider": "Darren Dreger", "handle": "@DarrenDreger", "outlet": "TSN", "tweets": [{"date": "2026-05-29", "text": "The St. Louis Blues are hoping to trade up in the 2026 NHL Draft order. The Calgary Flames also want to move up from their 6th-overall pick. Some interesting draft-day deal possibilities taking shape.", "url": "https://x.com/DarrenDreger"}]}, {"insider": "Frank Seravalli", "handle": "@frank_seravalli", "outlet": "Daily Faceoff", "tweets": [{"date": "2026-05-29", "text": "Jay Woodcroft remains the front-runner for the Toronto Maple Leafs head coaching position. (Note: Friedman subsequently refuted this May 30 — no interview expected.)", "url": "https://x.com/frank_seravalli"}]}, {"insider": "Chris Johnston", "handle": "@reporterchris", "outlet": "Sportsnet", "tweets": [{"date": "2026-05-30", "text": "Anaheim Ducks aren't under pressure to trade Mason McTavish this summer but may have to consider it. Center Leo Carlsson could command a 'monster contract' worth ~$14M AAV as an RFA. If the Ducks aren't going to spend to the cap, it could turn McTavish into a cost-cutting trade candidate.", "url": "https://www.youtube.com/watch?v=eMloqxVczaE"}]}, {"insider": "Dave Pagnotta", "handle": "@TheFourthPeriod", "outlet": "The Fourth Period", "tweets": [{"date": "2026-05-29", "text": "Former Pittsburgh Penguins assistant Todd Nelson has emerged as another name for the Toronto Maple Leafs coaching search. Nashville continues its GM search — Tom Fitzgerald has an interview scheduled.", "url": "https://x.com/TheFourthPeriod"}]}, {"insider": "Jeff Marek", "handle": "@JeffMarek", "outlet": "Sportsnet", "tweets": []}, {"insider": "Rick Dhaliwal", "handle": "@DhaliwalSports", "outlet": "CHEK / Daily Faceoff", "tweets": [{"date": "2026-05-30", "text": "Pierre Dorion is a strong candidate for the Vancouver Canucks GM vacancy. Confirming alongside Friedman and Thomas Drance that Dorion has emerged alongside Ryan Johnson as a leading finalist.", "url": "https://x.com/DhaliwalSports"}]}, {"insider": "Kevin Weekes", "handle": "@KevinWeekes", "outlet": "NHL Network", "tweets": []}, {"insider": "Arthur Staple", "handle": "@ArthurStaple", "outlet": "The Athletic", "tweets": []}], "transactions": [], "injuries": [{"name": "Mark Stone", "team": "VGK", "position": "RW", "status": "ACTIVE", "injury": "Lower-body (returned)", "detail": "Healthy and expected to play Game 1 of the Stanley Cup Final on June 2.", "vgk": true}], "news": [{"headline": "NHL.com Conn Smythe picks: Andersen (8 votes) leads Marner (4); 10 of 15 writers pick CAR to win Cup", "detail": "NHL.com's 15 staff writers published Conn Smythe predictions Sunday. Frederik Andersen received 8 votes, Mitch Marner 4, Logan Stankoven 1, Taylor Hall 1, and Jack Eichel 1. Ten of the 15 writers also predicted the Hurricanes would win the Stanley Cup, making Carolina the heavy public favorite heading into the series.", "source": "NHL.com", "url": "https://www.nhl.com/news/topic/playoffs/stanley-cup-final-conn-smythe-predictions-for-carolina-vegas-by-nhl-writers"}, {"headline": "Dennis Hull passes away at 81 — Blackhawks legend, Bobby's brother, 1972 Summit Series member", "detail": "Former Chicago Blackhawks winger Dennis Hull died Saturday at age 81. The younger brother of Bobby Hull, Dennis scored 303 goals and 654 points over 959 NHL regular-season games across 14 seasons (1964-78). He reached the SCF in 1965, 1971, and 1973 and was a member of Team Canada in the 1972 Summit Series.", "source": "Chicago Sun-Times", "url": "https://chicago.suntimes.com/blackhawks/2026/05/30/blackhawks-dennis-hull-bobby-brother-dies"}, {"headline": "Claude Lemieux's brain donated to UNITE Brain Bank to study CTE", "detail": "The family of Claude Lemieux announced Saturday they will donate his brain to the UNITE Brain Bank to study the long-term effects of repetitive head trauma. Lemieux died by suicide last week at age 60 while battling depression. The study will determine whether he suffered from chronic traumatic encephalopathy (CTE).", "source": "Daily Faceoff", "url": "https://www.dailyfaceoff.com/news/claude-lemieux-brain-donated-study-long-term-effects-cte-head-impact-traumatic-injury"}, {"headline": "Pierre Dorion emerges as Canucks GM frontrunner alongside Ryan Johnson", "detail": "Multiple insiders — Elliotte Friedman, Thomas Drance, and Rick Dhaliwal — all reported Saturday that former Ottawa Senators GM Pierre Dorion is a 'strong possibility' for the Vancouver Canucks GM vacancy. Dorion and current Canucks executive Ryan Johnson are the leading finalists. Canucks fans voiced displeasure on social media at the prospect of the Dorion hire.", "source": "Sportsnet / The Hockey News / CHEK", "url": "https://thehockeynews.com/nhl/vancouver-canucks/latest-news/potential-dorion-gm-hire-causes-canucks-fans-to-voice-displeasure"}, {"headline": "Morgan Rielly trade destinations: SJS, CHI, WPG, PIT, ANA, VAN all discussed", "detail": "Sportsnet's Ryan Dixon outlined potential trade destinations for Morgan Rielly following LeBrun and Johnston reporting that a trade is 'inevitable.' The Sharks and Blackhawks are the most logical rebuilding fits, but Rielly ($7.5M AAV, 4 years remaining) holds a full no-movement clause. The Jets are also mentioned given their blueline depth needs.", "source": "Sportsnet", "url": "https://www.sportsnet.ca/nhl/article/possible-trade-destinations-for-maple-leafs-defenceman-morgan-rielly/"}, {"headline": "VGK 'Original Misfits' head to 3rd Cup Final; CAR owner Dundon 'super thankful'", "detail": "The remaining four original Golden Knights — defensemen Shea Theodore and Brayden McNabb, and forwards William Karlsson and Reilly Smith — are heading to the franchise's third Stanley Cup Final since 2018. In Raleigh, Hurricanes owner Tom Dundon expressed gratitude for the breakthrough, noting coach Rod Brind'Amour and five long-tenured Canes: Aho, Svechnikov, Slavin, Martinook, and captain Jordan Staal.", "source": "Las Vegas Review-Journal / NHL.com", "url": "https://www.reviewjournal.com/sports/sports-columns/ed-graney/graney-remaining-misfits-prepare-for-3rd-stanley-cup-final-3831253/"}], "tweets": [], "amrewind": {"channel_url": "https://www.youtube.com/@theamrewind", "channel_handle": "@TheAMRewind", "description": "NHL goal breakdowns and deep dives by 3X Stanley Cup Champion and former NHL defenseman Alec Martinez — showcasing talent that doesn't always show up on the scoresheet.", "latest_videos": [{"title": "🚨Robinson's Air Mail ✈️📫 Goal Breakdown🚨", "type": "goal_breakdown", "published": "May 30, 2026", "description": "Alec breaks down a remarkable 'air mail' goal by Robinson — highlighting the puck movement, positioning, and the little things that made this play possible.", "url": "https://www.youtube.com/watch?v=JSZcPBLbLC0"}, {"title": "🚨Mark Stone Touchdown Pass Goal🚨", "type": "goal_breakdown", "published": "May 27, 2026", "description": "Alec breaks down Mark Stone's remarkable 'touchdown pass' goal in the WCF, highlighting off-puck positioning and tape-to-tape precision that set up the play.", "url": "h dle": "@FriedgeHNIC", "outlet": "Sportsnet", "tweets": [{"date": "2026-05-23", "text": "Mark Stone will play tonight for Vegas. Source close to the situation confirmed. Big development for VGK heading into Game 3.", "url": "https://www.yardbarker.com/nhl/articles/golden_knights_mark_stone_to_return_to_lineup_for_game_3/s1_16958_43880023"}, {"date": "2026-05-22", "text": "Vegas has still not granted permission for any team to interview Bruce Cassidy. Cassidy has indicated he’ll interview anywhere that he’s asked. This situation isn’t going away.", "url": "https://www.espn.com/nhl/story/_/id/48819143/sources-vegas-yet-allow-teams-talk-ex-coach-cassidy"}]}, {"insider": "Pierre LeBrun", "handle": "@PierreVLeBrun", "outlet": "The Athletic", "tweets": [{"date": "2026-05-22", "text": "Can confirm that the Edmonton Oilers and LA Kings have both been denied permission to speak with Bruce Cassidy by the Vegas Golden Knights. The NHL Coaches’ Association is monitoring the situation closely.", "url": "https://www.espn.com/nhl/story/_/id/48819143/sources-vegas-yet-allow-teams-talk-ex-coach-cassidy"}]}, {"insider": "Darren Dreger", "handle": "@DarrenDreger", "outlet": "TSN", "tweets": [{"date": "2026-05-23", "text": "The NHL’s denial of Vegas’s appeal re: the 2nd-round pick penalty and the Tortorella fine is significant. The league is sending a clear message about media access obligations, even in the playoffs.", "url": "https://www.espn.com/nhl/story/_/id/48817578/espnvgk-appeal-sanctions-led-loss-draft-pick-denied"}]}, {"insider": "Frank Seravalli", "handle": "@frank_seravalli", "outlet": "Daily Faceoff", "tweets": []}, {"insider": "Chris Johnston", "handle": "@reporterchris", "outlet": "Sportsnet", "tweets": []}, {"insider": "Dave Pagnotta", "handle": "@TheFourthPeriod", "outlet": "The Fourth Period", "tweets": []}, {"insider": "Jeff Marek", "handle": "@JeffMarek", "outlet": "Sportsnet", "tweets": []}, {"insider": "Rick Dhaliwal", "handle": "@DhaliwalSports", "outlet": "CHEK / oth sides.", "url": "https://www.spectorshockey.net/2026/05/nhl-rumor-mill-may-21-2026/"}, {"date": "May 20", "text": "Blackhawks are willing to trade Ilya Mikheyev's UFA signing rights. He rejected an extension. Chicago looking to bundle him in a larger deal.", "url": "https://www.spectorshockey.net/2026/05/nhl-rumor-mill-may-19-2026/"}, {"date": "May 20", "text": "VGK-Andersson extension: as expected, agreement in principle. Official July 1 once Pietrangelo clears to offseason LTIR. Multi-year deal.", "url": "https://www.spectorshockey.net/2026/05/nhl-rumor-mill-may-19-2026/"}, {"date": "May 19", "text": "Panthers have opened quiet conversations on Reinhart. He's one year from UFA. Suitors are out there but Panthers aren't in a rush to move him cheap.", "url": "https://www.spectorshockey.net/2026/05/nhl-rumor-mill-may-19-2026/"}]}, {"insider": "Pierre LeBrun", "handle": "@PierreVLeBrun", "outlet": "The Athletic / TSN", "avatar": "PL", "tweets": [{"date": "May 21", "text": "Minnesota's Quinn Hughes extension is the No. 1 priority for Bill Guerin before any trade pursuit. Hughes wants to stay — both sides optimistic.", "url": "https://www.spectorshockey.net/2026/05/nhl-rumor-mill-may-19-2026/"}, {"date": "May 21", "text": "Wild made a real offer to St. Louis for Robert Thomas. Blues rejected it. Thomas has a NTC but Guerin isn't giving up on finding a top-line center.", "url": "https://www.spectorshockey.net/2026/05/nhl-rumor-mill-may-19-2026/"}, {"date": "May 20", "text": "Columbus-Garland talks: CBJ came close at the deadline. The ask from Vancouver remains a first-round pick plus. Expect this to resurface this summer.", "url": "https://www.spectorshockey.net/2026/05/nhl-rumor-mill-may-19-2026/"}, {"date": "May 20", "text": "Alex Tuch camp is seeking Kempe-level money ($10.6M AAV). Buffalo countering in the $8.5-9.5M range. Gap is real but both sides want to get it done.", "url": "https://www.spectorshockey.net/2026/05/nhl-rumor-mill-may-19-2026/"}, {"date": "May 19", "text": "Panthers offseason will be more eventful than people expect. Bobrovsky situation, Reinhart extension talks, and a need for faster defensemen all in play.", "url": "https://www.spectorshockey.net/2026/05/nhl-rumor-mill-may-19-2026/"}]}, {"insider": "Darren Dreger", "handle": "@DarrenDreger", "outlet": "TSN", "avatar": "DD", "tweets": [{"date": "May 21", "text": "Reached out to Mike Babcock on Edmonton rumors. His response: 'Dregs, I'm retired. Loving it.' Oilers coaching search is ongoing — no frontrunner yet.", "url": "https://www.spectorshockey.net/2026/05/nhl-rumor-mill-may-21-2026/"}, {"date": "May 21", "text": "Blues-Sabres Robert Thomas talks: Buffalo is the frontrunner. St. Louis asking price involves a first, a top prospect, and a roster piece. Sabres working it.", "url": "https://www.spectorshockey.net/2026/05/nhl-rumor-mill-may-19-2026/"}, {"date": "May 20", "text": "Golden Knights and Hurricanes are the two teams most engaged on Bobrovsky. If FLA eats enough salary, CAR could make sense financially.", "url": "https://www.spectorshockey.net/2026/05/nhl-rumor-mill-may-19-2026/"}, {"date": "May 20", "text": "Jordan Kyrou's name has come up in multiple conversations this week. Blues asking for a top defensive prospect, a first, and term in a sign-and-trade.", "url": "https://www.spectorshockey.net/2026/05/nhl-rumor-mill-may-19-2026/"}, {"date": "May 19", "text": "Tristan Jarry situation in Edmonton becomes a problem if they don't upgrade in net. Two years left at $5.4M. Would need to attach a pick to move him.", "url": "https://www.spectorshockey.net/2026/05/nhl-rumor-mill-may-19-2026/"}]}, {"insider": "Chris Johnston", "handle": "@reporterchris", "outlet": "Sportsnet / SDPN", "avatar": "CJ", "tweets": [{"date": "May 21", "text": "Toronto GM John Chayka open to listening on any Maple Leaf except Auston Matthews. Nylander and Rielly both have NMCs — that constrains options significantly.", "url": "https://www.spectorshockey.net/2026/05/nhl-rumor-mill-may-21-2026/"}, {"date": "May 21", "text": "Matthews-Chayka meeting expected within the next two weeks. Matthews has 2 years remaining. Outcome of those talks shapes everything else Toronto does.", "url": "https://russianmachineneverbreaks.com/2026/05/20/toronto-maple-leafs-trade-rumor-auston-matthews-william-nylander-nhl/"}, {"date": "May 20", "text": "Chayka framing the summer as a retool, not a rebuild. He believes the core is salvageable — just needs pieces around it and cap flexibility.", "url": "https://www.spectorshockey.net/2026/05/nhl-rumor-mill-may-21-2026/"}, {"date": "May 20", "text": "Toronto won the draft lottery — selecting first overall. Gavin McKenna is the expected pick. That pick becomes a negotiating chip regardless.", "url": "https://www.spectorshockey.net/2026/05/nhl-rumor-mill-may-19-2026/"}]}, {"insider": "Frank Seravalli", "handle": "@frank_seravalli", "outlet": "Daily Faceoff", "avatar": "FS", "tweets": [{"date": "May 21", "text": "The VGK sanction story framed their WCF entry negatively. Instead of celebrating the best scoring race in conference final history, it's been fines and forfeitures.", "url": "https://www.dailyfaceoff.com/news/vegas-golden-knights-robbed-positive-coverage-entering-west-final-fine-forfeited-pick-nhl-john-tortorella"}, {"date": "May 21", "text": "Hellebuyck situation in Winnipeg: final year of his deal at $6.17M. If Jets fall short of their Cup window, would moving him actually make sense?", "url": "https://www.spectorshockey.net/2026/05/nhl-rumor-mill-may-19-2026/"}, {"date": "May 20", "text": "Lafrenière on the market: Rangers willing to discuss him in a package. He's young and has term but hasn't taken the step NYR hoped for.", "url": "https://nhlrumors.com/nhl-rumors-will-there-be-many-trades-this-offseason/2026/05/21/"}, {"date": "May 20", "text": "Mikheyev (CHI) signing rights: Blackhawks looking to bundle him in a larger deal as a sweetener. Not expecting a big return on the rights alone.", "url": "https://www.dailyfaceoff.com/news/chicago-blackhawks-make-ufa-ilya-mikheyev-negotiating-contract-rights-available-trade-nhl"}, {"date": "May 19", "text": "Owen Tippett injury impact: Flyers' offseason direction could shift depending on his recovery timeline. Teams that had him targeted are pausing.", "url": "https://nhlrumors.com/nhl-rumors-will-there-be-many-trades-this-offseason/2026/05/21/"}]}, {"insider": "Dave Pagnotta", "handle": "@TheFourthPeriod", "outlet": "The Fourth Period", "avatar": "DP", "tweets": [{"date": "May 21", "text": "Thin UFA market + $104M cap = trade-heavy offseason. Teams that need centers, goalies, and RHDs will be forced to pay a premium in trades.", "url": "https://nhlrumors.com/nhl-rumors-will-there-be-many-trades-this-offseason/2026/05/21/"}, {"date": "May 21", "text": "Tuch staying in Buffalo: would be a little surprised if he leaves. Deal is close enough. Expect it finalized around draft time.", "url": "https://nhlrumors.com/nhl-rumors-will-there-be-many-trades-this-offseason/2026/05/21/"}, {"date": "May 20", "text": "Kyrou, Lafrenière, Hellebuyck, Tippett (health permitting) — the trade market this summer could be more star-studded than any in recent memory.", "url": "https://nhlrumors.com/nhl-rumors-will-there-be-many-trades-this-offseason/2026/05/21/"}, {"date": "May 20", "text": "Buffalo-Thomas fits. Sabres have the assets and a clear center need. Blues would be selling to a conference rival but the price makes that easier to stomach.", "url": "https://nhlrumors.com/nhl-rumors-will-there-be-many-trades-this-offseason/2026/05/21/"}, {"date": "May 19", "text": "Montreal's success changes their off-season dynamic completely. They were sellers a year ago — they're buyers now. Slafkovsky, Demidov, Caufield as untouchables.", "url": "https://nhlrumors.com/nhl-rumors-will-there-be-many-trades-this-offseason/2026/05/21/"}, {"date": "May 19", "text": "Patrik Laine is UFA this summer. Canadiens will not re-sign him. His agent says he wants a two-year prove-it deal to rebuild value. Interesting market.", "url": "https://www.spectorshockey.net/2026/05/nhl-rumor-mill-may-19-2026/"}]}, {"insider": "Jeff Marek", "handle": "@JeffMarek", "outlet": "Sportsnet", "avatar": "JM", "tweets": [{"date": "May 21", "text": "Carolina falls flat in Game 1 after 11 days off. 6-2. Storyline of the conference final suddenly flipped — Montreal is the team to beat.", "url": "https://nhlrumors.com/nhl-rumors-will-there-be-many-trades-this-offseason/2026/05/21/"}, {"date": "May 21", "text": "Toronto situation brewing all summer. Chayka has to make a call on Matthews before the trade market opens fully. Everything else flows from that.", "url": "https://russianmachineneverbreaks.com/2026/05/20/toronto-maple-leafs-trade-rumor-auston-matthews-william-nylander-nhl/"}, {"date": "May 20", "text": "Wild paid a massive price for Quinn Hughes. A first-line center acquisition is next. Hard to imagine they stop there — Guerin is all-in on this window.", "url": "https://www.spectorshockey.net/2026/05/nhl-rumor-mill-may-19-2026/"}, {"date": "May 20", "text": "Oilers coaching search going wider than expected. At least five candidates. No frontrunner. Could be a longer process than the organization would like.", "url": "https://www.spectorshockey.net/2026/05/nhl-rumor-mill-may-19-2026/"}]}, {"insider": "Rick Dhaliwal", "handle": "@DhaliwalSports", "outlet": "CHEK TV / Sportsnet", "avatar": "RD", "tweets": [{"date": "May 21", "text": "Vancouver not ready to move Garland. The ask is a first plus a real return — Columbus won't go there yet. This one drags into the summer.", "url": "https://www.spectorshockey.net/2026/05/nhl-rumor-mill-may-19-2026/"}, {"date": "May 21", "text": "Thatcher Demko extension is Vancouver's summer priority. If that gets done, Canucks become sellers of depth. If not — his name enters trade talks.", "url": "https://www.spectorshockey.net/2026/05/nhl-rumor-mill-may-19-2026/"}, {"date": "May 20", "text": "J.T. Miller's time in Vancouver is over. Canucks moving away from big, older contracts. Finding a taker at his cap hit ($8M) is the challenge.", "url": "https://www.spectorshockey.net/2026/05/nhl-rumor-mill-may-19-2026/"}, {"date": "May 19", "text": "Elias Pettersson extension talks ongoing — both sides want it done before July 1. No concern this gets messy but term and AAV still being negotiated.", "url": "https://www.spectorshockey.net/2026/05/nhl-rumor-mill-may-19-2026/"}]}, {"insider": "Kevin Weekes", "handle": "@KevinWeekes", "outlet": "ESPN / NHL Network", "avatar": "KW", "tweets": [{"date": "May 21", "text": "If Connor Hellebuyck hits the open market it changes everything. Every Cup contender picks up the phone. Jets are aware of what they have.", "url": "https://www.spectorshockey.net/2026/05/nhl-rumor-mill-may-19-2026/"}, {"date": "May 21", "text": "Florida possibly trading Bobrovsky signals a full reset. If they move Reinhart too — this Panthers era is over. Significant rebuild territory.", "url": "https://www.spectorshockey.net/2026/05/nhl-rumor-mill-may-19-2026/"}, {"date": "May 20", "text": "Winnipeg offer sheet on Dorofeyev is plausible but VGK has the cap space to match and will. Still forces VGK's hand on his next deal earlier than planned.", "url": "https://www.spectorshockey.net/2026/05/nhl-rumor-mill-may-19-2026/"}, {"date": "May 20", "text": "Montreal's young core is completely untouchable after that Game 1 performance. Slafkovsky, Demidov, Caufield, Dobes — the Habs are building something real.", "url": "https://nhlrumors.com/nhl-rumors-will-there-be-many-trades-this-offseason/2026/05/21/"}, {"date": "May 19", "text": "Carolina after Game 1: the 11-day layoff was real. They looked flat and slow. Still elite — but they've been exposed as vulnerable. Game 2 is must-watch.", "url": "https://nhlrumors.com/nhl-rumors-will-there-be-many-trades-this-offseason/2026/05/21/"}]}, {"insider": "Arthur Staple", "handle": "@ArthurStaple", "outlet": "The Athletic", "avatar": "AS", "tweets": [{"date": "May 21", "text": "Rangers face real decisions on Lafrenière and Chytil. Drury wants better up the middle. One of those two becomes the centerpiece of an acquisition.", "url": "https://nhlrumors.com/nhl-rumors-will-there-be-many-trades-this-offseason/2026/05/21/"}, {"date": "May 21", "text": "Islanders are quietly active. More cap room than people realize. They've been making calls on top-6 forwards. Don't sleep on them as a summer destination.", "url": "https://nhlrumors.com/nhl-rumors-will-there-be-many-trades-this-offseason/2026/05/21/"}, {"date": "May 20", "text": "New Jersey committed to keeping Hischier and Jack Hughes — those are off the table. But depth pieces could move to create cap flexibility this summer.", "url": "https://nhlrumors.com/nhl-rumors-will-there-be-many-trades-this-offseason/2026/05/21/"}, {"date": "May 20", "text": "NYR-Islanders rivalry gets a subplot: both teams will be in the market this summer. Expect them to bid on similar targets. Drury vs. Matheson: round one.", "url": "https://nhlrumors.com/nhl-rumors-will-there-be-many-trades-this-offseason/2026/05/21/"}, {"date": "May 19", "text": "Devils sat 11 players who were above replacement level this year — they have real trade chips. The question is whether any of that becomes a star.", "url": "https://nhlrumors.com/nhl-rumors-will-there-be-many-trades-this-offseason/2026/05/21/"}]}], "transactions": [{"type": "extension", "date": "2026-05-20", "teams": ["WSH"], "vgk": false, "headline": "Liljegren re-signs with Capitals on 2-year deal", "detail": "Defenseman Timothy Liljegren signed a two-year contract extension worth $6.5 million to remain with the Washington Capitals.", "source": "PuckPedia", "url": "https://puckpedia.com/transactions"}, {"type": "extension", "date": "2026-05-20", "teams": ["BUF"], "vgk": false, "headline": "Lindy Ruff signs 2-year extension to remain Sabres head coach", "detail": "Buffalo Sabres head coach Lindy Ruff agreed to a two-year contract extension, keeping him behind the bench in Buffalo.", "source": "NHL.com", "url": "https://www.nhl.com/news/coach-lindy-ruff-signs-two-year-contract-with-buffalo-sabres"}], "injuries": [{"name": "Mark Stone", "team": "VGK", "position": "RW", "status": "OUT", "injury": "Lower-body", "detail": "Stone has missed five consecutive games since leaving Game 3 of R2 vs. Anaheim in late May. No official return timeline. Practiced lightly but remains day-to-day heading into WCF Game 2.", "vgk": true}, {"name": "William Karlsson", "team": "VGK", "position": "C", "status": "OUT", "injury": "Lower-body", "detail": "Karlsson has been out since Nov. 8, 2025, and has not played in the 2026 playoffs. His availability, if any, would only come in the deep rounds.", "vgk": true}, {"name": "Cale Makar", "team": "COL", "position": "D", "status": "DTD", "injury": "Undisclosed", "detail": "Makar did not play in WCF Game 1 and his status for Game 2 tonight remains unclear. A major factor in the series — his absence was notable in Colorado's 4-2 loss.", "vgk": false}], "news": [{"headline": "Canadiens score 4 in 1st period, shock previously unbeaten Hurricanes 6-2 in ECF Game 1", "detail": "Montreal became just the 3rd team since 2010 to score four or more goals in the first period of a conference final game. Carolina, which had swept Ottawa and Philadelphia without breaking a sweat, looked flat and ill-prepared for the speed of the Canadiens. Game 2 is Saturday night in Raleigh.", "source": "NHL.com", "url": "https://www.nhl.com/news/montreal-canadiens-carolina-hurricanes-game-1-recap-may-21-2026"}, {"headline": "NHL denies Golden Knights sanctions appeal — $100K fine and 2026 second-round pick forfeiture stand", "detail": "The NHL upheld its penalties against the Vegas Golden Knights stemming from repeated violations of playoff media access rules. Head coach John Tortorella was fined $100,000 and the team forfeits its 2026 second-round draft pick. The appeal was heard in New York on May 20.", "source": "ESPN", "url": "https://www.espn.com/nhl/story/_/id/48817578/espnvgk-appeal-sanctions-led-loss-draft-pick-denied"}, {"headline": "2026-27 NHL salary cap to reach $104 million — Friedman", "detail": "Per Elliotte Friedman, the NHL has informed teams the cap ceiling for next season will be $104 million, an all-time high. This gives teams across the league significant flexibility in shaping their rosters for the future.", "source": "Sportsnet", "url": "https://www.spectorshockey.net/2026/05/nhl-rumor-mill-may-21-2026/"}, {"headline": "Maple Leafs GM Chayka listening to offers on all players except Auston Matthews", "detail": "New Toronto general manager John Chayka, hired May 3, is signaling a major retool. Sources say he is open to discussing any player except captain Auston Matthews. Some players (Nylander, Rielly) have NMCs. Chayka is expected to set high asking prices rather than stage a fire sale.", "source": "Sportsnet / SDPN", "url": "https://www.spectorshockey.net/2026/05/nhl-rumor-mill-may-21-2026/"}, {"headline": "Cale Makar's status unclear heading into WCF Game 2 tonight", "detail": "Colorado Avalanche defenseman Cale Makar missed WCF Game 1 with an undisclosed injury and has not been confirmed for tonight's Game 2 in Denver. His absence would be significant for a Colorado team that needs to even the series.", "source": "NHL.com", "url": "https://www.nhl.com/news/vegas-golden-knights-colorado-avalanche-2026-western-conference-final-series-preview"}], "amrewind": {"description": "NHL goal breakdowns and deep dives by 3X Stanley Cup Champion and former NHL defenseman Alec Martinez — showcasing talent that doesn't always show up on the scoresheet.", "channel_url": "https://www.youtube.com/@theamrewind", "channel_handle": "@TheAMRewind", "latest_videos": [{"title": "QUICK BONUS CONTENT — Newhook's Series Clinching OT Winner", "url": "https://www.youtube.com/watch?v=qVHrLWesIZM", "published": "May 20, 2026", "type": "bonus_content", "description": "Quick breakdown of Alex Newhook's series-clinching overtime winner for Vegas."}, {"title": "Young Star Zach Benson Goal Breakdown", "url": "https://www.youtube.com/watch?v=VrJC9ZunmNY", "published": "May 20, 2026", "type": "goal_breakdown", "description": "A deep dive into Buffalo's young star Zach Benson and the details behind his playoff goal."}, {"title": "Mitch Marner THREE Goal Breakdown", "url": "https://www.youtube.com/watch?v=F1bMEn6J2zE", "published": "May 17, 2026", "type": "goal_breakdown", "description": "Breakdown of all three Mitch Marner goals from Game 6 vs Anaheim. Marner is leading the entire NHL playoffs in points with 18."}], "comments": [{"author": "@Tadavegas", "text": "Didn't even know you had a podcast and neither does Google. Buddy you gotta plug your channel on the other pods you go on. Glad I found this"}, {"author": "@StevenGrant_Photographer", "text": "Premium play. Premium Stanley Cup Veteran Analysis."}, {"author": "@shinywintertide", "text": "Loved the pod with Millard & Shannon. Thanks for the breakdown!"}, {"author": "@zeromaz6618", "text": "that goal was so sick. i had to watch it like 5 times in a row as soon as i saw it"}, {"author": "@brandonframe7655", "text": "Love the content so far, but we gotta do better than 360p video quality."}]}, "podcasts": [{"show": "Empty Netters", "icon": "EN", "color": "gold", "description": "Brothers Dan & Chris Powers bring the best news, analysis & interviews in hockey.", "url": "https://www.iheart.com/podcast/867-empty-netters-podcast-112705987/", "episodes": [{"title": "Game 1 Of The Eastern Conference Final Was A Nightmare For Carolina", "date": "May 22, 2026", "duration": "96 min", "description": "Game 1 of the ECF couldn't have gone worse for the Hurricanes, and it couldn't have gone better for the Habs. The boys recap all the action and discuss what Colorado needs to get back on track in Game 2.", "url": "https://www.iheart.com/podcast/867-empty-netters-podcast-112705987/episode/game-1-of-the-eastern-conference-334509722/"}, {"title": "How Did Nobody Tell Us Makar Is Actually Hurt?!", "date": "May 21, 2026", "duration": "92 min", "description": "Vegas takes advantage of a Makar-less Avalanche and wins Game 1. Marner continues to dominate even without Mark Stone. The boys are LIVE recapping the first night of the Conference Finals.", "url": "https://www.iheart.com/podcast/867-empty-netters-podcast-112705987/episode/how-did-nobody-tell-us-makar-334391303/"}, {"title": "NHL Conference Finals Preview w/ Alec Martinez", "date": "May 20, 2026", "duration": "74 min", "description": "Habs vs. Canes. Vegas vs. Avs. Can Carolina stop the ECF curse? Are the Habs a team of destiny? Can the Avs break the President's Trophy curse — or can Vegas and Mitch Marner stay hot?", "url": "https://www.iheart.com/podcast/867-empty-netters-podcast-112705987/episode/nhl-conference-finals-preview-w-alec-334216394/"}]}, {"show": "The All-In Podcast", "icon": "AI", "color": "purple", "description": "Chamath, Jason, Sacks & Friedberg on tech, startups, politics, and the economy.", "url": "https://allin.com/episodes", "episodes": [{"title": "Episode #273 — Marc Benioff", "date": "May 15, 2026", "duration": null, "description": "U.S.-China relations, Taiwan, and AI's impact on enterprise software. Marc Benioff discusses Salesforce's strategy, the OpenAI vs. Apple competition, and the science corner covers El Niño climate effects.", "url": "https://youtube.com/watch?v=jJRAvZNGUvI"}, {"title": "Charles & Chase Koch: How We Grew Koch Industries to $150B Without Going Public", "date": "May 12, 2026", "duration": null, "description": "Koch Industries' history, growth through strategic acquisitions like Georgia-Pacific and Molex, company culture, the benefits of staying private, and Chase Koch's insights on purpose-driven education.", "url": "https://youtube.com/watch?v=EIo3AuyvV84"}, {"title": "Spencer Pratt on Fixing LA: Wildfires, Homelessness, Corruption & the Fight to Take It Back", icket contracts as they rebalance their cap sheet.", "url": "https://www.spectorshockey.net/2026/05/nhl-rumor-mill-may-19-2026/"}]}, {"insider": "Kevin Weekes", "handle": "@KevinWeekes", "outlet": "ESPN / NHL Network", "avatar": "KW", "tweets": [{"date": "May 20", "text": "Florida's willingness to move Bobrovsky signals a full reset in net. Reinhart situation bears watching too — this could be a transformative offseason for the Panthers.", "url": "https://www.spectorshockey.net/2026/05/nhl-rumor-mill-may-19-2026/"}, {"date": "May 19", "text": "If Hellebuyck reaches the open market it would be the biggest goalie trade in years. Every contender picks up the phone. Jets know this.", "url": "https://www.spectorshockey.net/2026/05/nhl-rumor-mill-may-19-2026/"}, {"date": "May 19", "text": "Winnipeg offer sheet on Dorofeyev would be a bold move but not without risk. VGK has cap space to match — and they will. Still, forces them to commit.", "url": "https://www.spectorshockey.net/2026/05/nhl-rumor-mill-may-19-2026/"}]}, {"insider": "Arthur Staple", "handle": "@ArthurStaple", "outlet": "The Athletic", "avatar": "AS", "tweets": [{"date": "May 20", "text": "Rangers have hard decisions ahead on Lafrenière and Chytil. Drury wants to add up the middle — one of those two could be the centerpiece of a trade.", "url": "https://nhlrumors.com/nhl-rumors-will-there-be-many-trades-this-offseason/2026/05/21/"}, {"date": "May 19", "text": "Islanders quietly making calls on top-6 help. Their summer flexibility is better than people realize. Don't sleep on them as a destination.", "url": "https://nhlrumors.com/nhl-rumors-will-there-be-many-trades-this-offseason/2026/05/21/"}, {"date": "May 19", "text": "Devils committed to keeping Hischier and Jack Hughes off the market but will listen to calls about depth pieces. Expansion of cap space the goal.", "url": "https://nhlrumors.com/nhl-rumors-will-there-be-many-trades-this-offseason/2026/05/21/"}]}]}]};

function metricCard(label,value,sub,small){
  return '<div class="metric gold-accent">'
    + '<div class="metric-label">'+esc(label)+'</div>'
    + '<div class="metric-value'+(small?' sm':'')+'">'+esc(value||'—')+'</div>'
    + (sub?'<div class="metric-sub">'+esc(sub)+'</div>':'')
    + '</div>';
}

function panelVGK(ed){
  const v = ed.vgk || {};
  const notes = (v.notes||[]).map(n=>'<li>'+esc(n)+'</li>').join('');
  const toggleFn = "var b=this.nextElementSibling;this.classList.toggle('open');b.classList.toggle('open');";
  let html = '<div class="metrics-grid">'
    + metricCard('VGK · Postseason', v.record, v.record_detail||'Vegas Golden Knights', false)
    + metricCard('VGK · Series', v.series_short, 'Stanley Cup Playoffs', false)
    + metricCard('Next VGK Game', v.next, v.next_detail||'', true)
    + '</div>';
  html += '<button class="roster-toggle-btn rtb-gold" onclick="'+toggleFn+'">'
    + '<span class="rtb-label">VGK Broadcast Briefing</span>'
    + '<span class="rtb-chevron">▾</span>'
    + '</button>'
    + '<div class="roster-body rtb-gold">'
    + '<div class="rtb-content">'
    + (v.series?'<div class="series-teams" style="font-size:18px;margin-bottom:10px">'+esc(v.series)+'</div>':'')
    + '<div class="ai-block"><p>'+esc(v.spotlight||'')+'</p></div>'
    + (notes?'<ul class="fact-list">'+notes+'</ul>':'')
    + (v.next?'<div class="next-line">Next up &mdash; <strong>'+esc(v.next)+'</strong>'
        + (v.next_detail?' &middot; '+esc(v.next_detail):'')+'</div>':'')
    + '</div>'
    + '</div>';

  const r = v.roster || {};
  const fwds = r.forwards || [];
  const defs = r.defense || [];
  const gols = r.goalies || [];

  if(fwds.length || defs.length || gols.length){
    const toggleFn = "var b=this.nextElementSibling;this.classList.toggle('open');b.classList.toggle('open');";
    html += '<button class="roster-toggle-btn" onclick="'+toggleFn+'">'
      + '<span class="rtb-label">Roster Stats</span>'
      + '<span class="rtb-chevron">▾</span>'
      + '</button>'
      + '<div class="roster-body">';

    if(fwds.length){
      html += '<div class="roster-section-label">Forwards</div>'
        + '<div class="roster-wrap"><table class="roster-table"><thead><tr>'
        + '<th>#</th><th>Name</th><th>Pos</th><th>GP</th><th>G</th><th>A</th>'
        + '<th class="pts-col">PTS</th><th>+/-</th><th>PIM</th><th>SOG</th>'
        + '<th>S%</th><th>TOI</th><th>FO%</th><th>HIT</th><th>BLK</th>'
        + '</tr></thead><tbody>';
      fwds.forEach(p => {
        const pm = p.pm != null ? (p.pm >= 0 ? '+' : '') + p.pm : '—';
        html += '<tr'+(p.inj?' class="inj"':'')+'>'

function renderScoreboard(g){
  const hasStructured = g.away_abbr && g.home_abbr && g.away_score != null && g.home_score != null;
  if(!hasStructured) return '<div class="game-score">'+esc(g.matchup)+'</div>';
  const awayWin = g.winner_abbr === g.away_abbr;
  const homeWin = g.winner_abbr === g.home_abbr;
  return '<div class="scoreboard">'
    + '<div class="sb-side">'
      + '<div class="sb-abbr '+(awayWin?'winner-team':'loser-team')+'">'+esc(g.away_abbr)+'</div>'
      + '<div class="sb-venue-tag">Away</div>'
    + '</div>'
    + '<div class="sb-center">'
      + '<div class="sb-score'+(awayWin?'':' dim')+'">'+esc(g.away_score)+'</div>'
      + '<div class="sb-sep">&mdash;</div>'
      + '<div class="sb-score'+(homeWin?'':' dim')+'">'+esc(g.home_score)+'</div>'
    + '</div>'
    + '<div class="sb-side">'
      + '<div class="sb-abbr '+(homeWin?'winner-team':'loser-team')+'">'+esc(g.home_abbr)+'</div>'
      + '<div class="sb-venue-tag">Home</div>'
    + '</div>'
    + '</div>';
}

function renderGoals(g){
  const goals = g.goals || [];
  if(!goals.length) return '';
  // group by period
  const periods = [];
  const byPeriod = {};
  goals.forEach(goal => {
    if(!byPeriod[goal.period]){ byPeriod[goal.period] = []; periods.push(goal.period); }
    byPeriod[goal.period].push(goal);
  });
  const periodLabel = p => p === 'P1' ? '1st Period' : p === 'P2' ? '2nd Period' : p === 'P3' ? '3rd Period' : p.replace('P','') + ' OT';
  let html = '<div class="goal-log">';
  periods.forEach(p => {
    html += '<div class="goal-period-header">'+periodLabel(p)+'</div>';
    byPeriod[p].forEach(goal => {
      const isVGKGoal = goal.team === 'VGK';
      const teamBadge = '<span class="goal-team-badge'+(isVGKGoal?' vgk':'')+'">' + esc(goal.team) + '</span>';
      const assists = [goal.a1, goal.a2].filter(Boolean);
      const assistStr = assists.length ? '<span class="goal-assists"> ('+assists.map(esc).join(', ')+')</span>' : '';
      const st = (goal.strength||'EV').toLowerCase();
      const stBadge = (st !== 'ev') ? '<span class="goal-strength '+st+'">'+st.toUpperCase()+'</span>' : '';
      html += '<div class="goal-row">'
        + '<span class="goal-time">'+esc(goal.time)+'</span>'
        + teamBadge
        + '<span class="goal-scorer">'+esc(goal.scorer)+'</span>'
        + assistStr
        + stBadge
        + '</div>';
    });
  });
  html += '</div>';
  return html;
}

    + 'Check the Standings tab for the next puck drop.</p></div>';

      + renderScoreboard(g)

  const tweets = ed.tweets || [];

  let tw = '<div class="tweet-header">'
    + '<div class="tweet-header-icon">𝕏</div>'
    + '<div class="tweet-header-info"><strong>@EmptyNettersPod</strong><span>Empty Netters Podcast</span></div>'

    }

      const tweetText = t.url
        ? '<a href="'+esc(t.url)+'" target="_blank" rel="noopener">'+esc(t.text)+'</a>'
        : esc(t.text);
      return '<div class="tweet-item">'
        + '<div class="tweet-text">'+tweetText+'</div>'

      return '<div class="injury-row">'
        + '<span class="injury-status '+cls+'">'+esc(i.status||'?')+'</span>'
        + '<div class="injury-name">'
          + '<strong>'+esc(i.name)+'</strong>'
          + '<div class="injury-meta">'+esc(i.team)+' &middot; '+esc(i.position)+' &middot; '+esc(i.injury)+'</div>'
          + '<div class="injury-detail">'+esc(i.detail)+'</div>'

function panelRumors(ed){
  const rawRumors = ed.rumors || [];

  // All 10 known insiders — always shown even with no activity
  const KNOWN_INSIDERS = [
    { insider:'Elliotte Friedman', handle:'@FriedgeHNIC',      outlet:'Sportsnet' },
    { insider:'Pierre LeBrun',     handle:'@PierreVLeBrun',    outlet:'The Athletic' },
    { insider:'Darren Dreger',     handle:'@DarrenDreger',     outlet:'TSN' },
    { insider:'Frank Seravalli',   handle:'@frank_seravalli',  outlet:'Daily Faceoff' },
    { insider:'Chris Johnston',    handle:'@reporterchris',    outlet:'Sportsnet' },
    { insider:'Dave Pagnotta',     handle:'@TheFourthPeriod',  outlet:'The Fourth Period' },
    { insider:'Jeff Marek',        handle:'@JeffMarek',        outlet:'Sportsnet' },
    { insider:'Rick Dhaliwal',     handle:'@DhaliwalSports',   outlet:'CHEK / Daily Faceoff' },
    { insider:'Kevin Weekes',      handle:'@KevinWeekes',      outlet:'NHL Network' },
    { insider:'Arthur Staple',     handle:'@ArthurStaple',     outlet:'The Athletic' },
  ];

  // Merge edition rumors into insider cards
  const insiderMap = {};
  KNOWN_INSIDERS.forEach(ins => { insiderMap[ins.insider] = { ...ins, tweets: [] }; });

  rawRumors.forEach(r => {
    const key = r.insider || 'Unknown';
    if(!insiderMap[key]){
      insiderMap[key] = { insider: r.insider, handle: r.handle || '', outlet: r.outlet || '', tweets: [] };
    }
    if(r.tweets){ r.tweets.forEach(t => insiderMap[key].tweets.push(t)); }
    else if(r.content){ insiderMap[key].tweets.push({ date: r.date, text: r.content, url: r.url || '' }); }
  });

  const insiders = KNOWN_INSIDERS.map(ins => insiderMap[ins.insider]);

  const cards = insiders.map((ins, idx) => {
    const tweets = ins.tweets || [];
    const first5 = tweets.slice(0, 2);
    const rest   = tweets.slice(2);
    function renderTweet(tw){
      const link = tw.url
        ? '<a href="'+esc(tw.url)+'" target="_blank" rel="noopener">'+esc(tw.text)+'</a>'
        : esc(tw.text);
      return '<div class="rumor-tweet">'
        + '<div class="rumor-tweet-date">'+esc(tw.date)+'</div>'
        + '<div class="rumor-tweet-text">'+link+'</div>'
        + '</div>';
    }
    const overflowId = 'ro-'+idx;
    const btnId = 'rb-'+idx;
    const toggleFn = "var o=document.getElementById('"+overflowId+"'),b=document.getElementById('"+btnId+"');o.classList.toggle('open');b.classList.toggle('open');";
    const moreBtn = rest.length
      ? '<button class="rumor-more-btn" id="'+btnId+'" onclick="'+toggleFn+'">'
        + rest.length+' more <span class="rtb-chevron">▾</span></button>'
        + '<div class="rumor-overflow" id="'+overflowId+'">'+rest.map(renderTweet).join('')+'</div>'
      : '';
    const noActivity = !tweets.length
      ? '<div class="rumor-tweet"><div class="rumor-tweet-text" style="color:var(--muted);font-style:italic">No posts in the last 48 hrs</div></div>'
      : '';
    return '<div class="rumor-card">'
      + '<div class="rumor-header">'
        + '<div class="rumor-avatar">'+esc(ins.avatar||ins.insider.split(' ').map(w=>w[0]).join('').slice(0,2))+'</div>'
        + '<div class="rumor-meta">'
          + '<div class="rumor-name">'+esc(ins.insider)+'</div>'
          + '<div class="rumor-handle">'+esc(ins.handle)+'</div>'
          + '<div class="rumor-outlet">'+esc(ins.outlet)+'</div>'
        + '</div>'
      + '</div>'
      + noActivity
      + first5.map(renderTweet).join('')
      + moreBtn
      + '</div>';
  }).join('');
  return '<div class="rumors-grid">'+cards+'</div>';
}

function syncTabs(){
  document.querySelectorAll('.tab').forEach(b =>
    b.classList.toggle('active', b.dataset.tab===activeTab));
  document.querySelectorAll('.tab-panel').forEach(p =>
    p.classList.toggle('active', p.id==='panel-'+activeTab));
}

function renderEdition(ed){
  el('dateline').textContent = fmtLong(ed.date);
  el('panels').innerHTML = TABS.map(([id]) =>
    '<div class="tab-panel'+(id===activeTab?' active':'')+'" id="panel-'+id+'">'
    + PANELS[id](ed) + '</div>').join('');
}

(function init(){
  if(!EDITIONS.length){
    el('panels').innerHTML = '<div class="lede"><div class="lede-tag">No data yet</div>'
      + '<h2>The aggregator has not run.</h2>'
      + '<p>This portal will fill in on the next scheduled run.</p></div>';
    el('editionSelect').style.display = 'none';
    return;
  }
  const sel = el('editionSelect');
  EDITIONS.forEach((ed,i) => {
    const o = document.createElement('option');
    o.value = i;
    o.textContent = fmtShort(ed.date) + (i===0?'  ·  latest':'');
    sel.appendChild(o);
  });
  sel.addEventListener('change', () => renderEdition(EDITIONS[+sel.value]));

  el('tabRow').innerHTML = TABS.map(([id,label]) =>
    '<button class="tab'+(id===activeTab?' active':'')+'" data-tab="'+id+'">'
    + label + '</button>').join('');
  el('tabRow').querySelectorAll('.tab').forEach(b =>
    b.addEventListener('click', () => { activeTab = b.dataset.tab; syncTabs(); }));

  el('footNote').textContent =
    'NHL Morning Briefing · ' + EDITIONS.length + ' edition'
    + (EDITIONS.length>1?'s':'') + ' · refreshed every morning by 5:00 a.m. PT · built Jun 02, 2026 at 11:14 PM';

  renderEdition(EDITIONS[0]);
})();
</script>
</body>
</html>
